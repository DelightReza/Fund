name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name for the Android App'
        required: false
        default: 'fund'
        type: string
      codename:
        description: 'Codename for the Android package'
        required: false
        default: 'com.delightreza'
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Configure Dynamic Android Package and MainActivity
        env:
          APP_NAME: ${{ inputs.name }}
          CODENAME: ${{ inputs.codename }}
        run: |
          PACKAGE_NAME="${CODENAME}.${APP_NAME}"
          echo "Configuring package name: $PACKAGE_NAME"
          echo "APP_PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

          APP_LABEL="$(echo "$APP_NAME" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          echo "APP_LABEL=$APP_LABEL" >> $GITHUB_ENV

          # Determine Version Name
          if [ -f "app/build.gradle.kts" ] && grep -q 'versionName' app/build.gradle.kts; then
            VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | awk -F'"' '{print $2}')
          elif [ -f "android/app/build.gradle.kts" ] && grep -q 'versionName' android/app/build.gradle.kts; then
            VERSION_NAME=$(grep 'versionName' android/app/build.gradle.kts | awk -F'"' '{print $2}')
          elif [ -f "pubspec.yaml" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          else
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name "$APP_NAME" --org "$CODENAME"
          else
            KOTLIN_ROOT="android/app/src/main/kotlin"
            TARGET_DIR="$KOTLIN_ROOT/$(echo "$PACKAGE_NAME" | tr '.' '/')"
            
            find "$KOTLIN_ROOT" -type f -name "MainActivity.kt" -delete
            find "$KOTLIN_ROOT" -type d -empty -delete 2>/dev/null || true

            mkdir -p "$TARGET_DIR"
            printf "package %s\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity()\n" "$PACKAGE_NAME" > "$TARGET_DIR/MainActivity.kt"

            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              sed -i -E "s/android:label=\"[^\"]*\"/android:label=\"$APP_LABEL\"/g" android/app/src/main/AndroidManifest.xml
            fi

            echo "✓ Successfully configured $PACKAGE_NAME in $TARGET_DIR/MainActivity.kt"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload-keystore.jks"

      - name: Build Signed APK (Release)
        env:
          KEYSTORE_FILE_PATH: "${{ runner.temp }}/upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p build/app/outputs/flutter-apk
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APP_LABEL}-${VERSION_NAME}.apk"
          fi

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: build/app/outputs/flutter-apk/${{ env.APP_LABEL }}-${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
