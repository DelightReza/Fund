
name: fund_flutter
description: A fund & expense tracker for groups.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  http: ^1.2.0
  shared_preferences: ^2.2.3
  json_annotation: ^4.9.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  flutter_svg: ^2.0.9
  go_router: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

