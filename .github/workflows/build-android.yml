name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: Build signed Android artifacts using keystore secrets
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        if: ${{ inputs.build_signed == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload-keystore.jks"

      - name: Build APK (Release)
        if: ${{ inputs.build_signed != true }}
        run: flutter build apk --release

      - name: Build Signed APK (Release)
        if: ${{ inputs.build_signed == true }}
        env:
          KEYSTORE_FILE_PATH: "${{ runner.temp }}/upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        if: ${{ inputs.build_signed != true }}
        run: flutter build appbundle --release

      - name: Build Signed App Bundle (AAB)
        if: ${{ inputs.build_signed == true }}
        env:
          KEYSTORE_FILE_PATH: "${{ runner.temp }}/upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
